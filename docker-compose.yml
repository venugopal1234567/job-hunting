version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: remotehunter-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-remotehunter}
      POSTGRES_USER: ${DB_USER:-hunter}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-hunterpass}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - remotehunter-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hunter -d remotehunter"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: remotehunter-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-remotehunter}
      DB_USER: ${DB_USER:-hunter}
      DB_PASSWORD: ${DB_PASSWORD:-hunterpass}
      # LLM Provider / NVIDIA configuration
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      NVIDIA_BASE_URL: ${NVIDIA_BASE_URL:-https://integrate.api.nvidia.com/v1}
      NVIDIA_MODEL: ${NVIDIA_MODEL:-z-ai/glm-5.2}
      SERVER_PORT: 8080
      SERPAPI_API_KEY: ${SERPAPI_API_KEY:-}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - remotehunter-net
    extra_hosts:
      - "host.docker.internal:host-gateway"

  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    container_name: remotehunter-ui
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - remotehunter-net

volumes:
  pgdata:

networks:
  remotehunter-net:
    driver: bridge
